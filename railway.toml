[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "sh -c 'uvicorn admin.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "resume-manager"
startCommand = "python main.py"

[[services]]
name = "admin"
startCommand = "sh -c 'uvicorn admin.main:app --host 0.0.0.0 --port ${PORT:-8000}'"